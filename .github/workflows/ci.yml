name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Syntax check
        run: for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done

      - name: Unit + integration tests (mock WoW API)
        run: lua5.1 tests/run.lua

      - name: Test packaging
        run: .github/scripts/package.sh v0.0.0-ci
