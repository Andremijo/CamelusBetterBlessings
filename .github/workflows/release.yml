name: Release

# Fully automatic: whenever main gets a "## Version:" in CamelusBetterBlessings.toc
# that has not been released yet, this builds and publishes a WoWUp-ready release
# (tag vX.Y.Z, CamelusBetterBlessings-vX.Y.Z-forever.zip and release.json).
#
# To ship a new version: bump "## Version:" in the .toc and merge to main. That's it.
# Merges that keep the same version publish nothing.
# A version with a suffix (1.1.0-beta.1) becomes a pre-release: WoWUp only offers
# those to users on its Beta/Alpha channel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from the .toc
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW="$(sed -n 's/^## Version:[[:space:]]*//p' CamelusBetterBlessings.toc | head -n1 | tr -d '\r[:space:]')"
          VERSION="v${RAW#v}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'## Version: $RAW' in the .toc is not a valid version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already released - bump '## Version:' in the .toc to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Will release $VERSION"
          fi

      - name: Install Lua 5.1
        if: steps.version.outputs.exists == 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Syntax check and tests
        if: steps.version.outputs.exists == 'false'
        run: |
          for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests/run.lua

      - name: Package
        if: steps.version.outputs.exists == 'false'
        run: .github/scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$VERSION" \
            "dist/CamelusBetterBlessings-${VERSION}-forever.zip" \
            dist/release.json \
            --title "Camelus' Better Blessings ${VERSION}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${FLAGS[@]}"
